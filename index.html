<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Katas en trazos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: índice lateral fijo (tomos → capítulos y katas) + vista central (portada, kata con reproductor y cuadrícula, o capítulo de texto) */
:root{
  --paper:#f2f3f5; --sheet:#ffffff; --ink:#1b2130; --muted:#5d6577; --line:#d9dce3;
  --accent:#b9412c; --link:#2e4ea3; --plate:#ffffff;
  --f-display:"Shippori Mincho B1", "Hiragino Mincho ProN", Georgia, serif;
  --f-body:"Zen Kaku Gothic New", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11141b; --sheet:#191d27; --ink:#e6e8ee; --muted:#9aa2b3; --line:#2c3240;
  --accent:#ec8a74; --link:#93a9ef; --plate:#eef0f3; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11141b; --sheet:#191d27; --ink:#e6e8ee; --muted:#9aa2b3; --line:#2c3240;
  --accent:#ec8a74; --link:#93a9ef; --plate:#eef0f3; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:var(--link)}
body{padding:0}
.wrap{max-width:1160px;margin:0 auto;padding:26px max(16px,env(safe-area-inset-right,0px)) 60px max(16px,env(safe-area-inset-left,0px))}
@media (max-width:880px){.wrap{padding-top:16px}}

/* cabecera */
.top{position:sticky;top:0;z-index:50;background:var(--sheet);border-bottom:1px solid var(--line)}
.bar{max-width:1160px;margin:0 auto;display:flex;align-items:center;gap:6px;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));min-height:56px}
.brand{font-family:var(--f-display);font-weight:800;font-size:19px;color:var(--ink);text-decoration:none;margin-right:14px;white-space:nowrap}
.primary{display:flex;gap:2px}
.mi{font:inherit;font-size:14px;font-weight:700;background:none;border:0;border-bottom:3px solid transparent;color:var(--ink);padding:8px 12px;cursor:pointer;border-radius:6px 6px 0 0;display:flex;align-items:center;gap:6px}
.mi:hover{background:var(--paper)}
.mi[aria-expanded="true"]{border-bottom-color:var(--accent);background:var(--paper)}
.mi .car{font-size:10px;color:var(--muted)}
.mi.here{color:var(--accent)}
.spacer{flex:1}
.searchbox{position:relative;width:min(300px,34vw);transition:width .2s}
.searchbox:focus-within{width:min(420px,46vw)}
.searchbox input{width:100%;font:inherit;font-size:14px;padding:8px 12px 8px 34px;border:1px solid var(--line);border-radius:99px;background:var(--paper);color:var(--ink)}
.searchbox svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.icon{font:inherit;background:none;border:1px solid transparent;border-radius:8px;width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink);cursor:pointer}
.icon:hover{background:var(--paper);border-color:var(--line)}
#sbtn{display:none}
.panel{position:absolute;left:0;right:0;top:100%;background:var(--sheet);border-bottom:1px solid var(--line);box-shadow:0 14px 30px rgba(10,14,25,.12);max-height:min(72vh,640px);overflow:auto}
.panel[hidden]{display:none}
.pin{max-width:1160px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 22px max(16px,env(safe-area-inset-left,0px))}
.pin h3{font-family:var(--f-display);font-size:22px;margin:0 0 2px}
.pin p.d{margin:0 0 14px;color:var(--muted);font-size:13.5px;max-width:70ch}
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:2px 14px;list-style:none;margin:0;padding:0}
.links a{display:flex;justify-content:space-between;gap:8px;padding:6px 8px;border-radius:6px;color:var(--ink);text-decoration:none;border-left:3px solid transparent}
.links a:hover{background:var(--paper)}
.links a[aria-current]{font-weight:700;border-left-color:var(--accent);background:var(--paper)}
.links .c{font-family:var(--f-mono);font-size:11px;color:var(--muted);align-self:center;white-space:nowrap}
.rgroup{margin:0 0 14px}
.rgroup h4,.drawer h4{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:14px 0 4px;font-weight:700}
.res-sec{margin:0 0 12px}
.res-sec h4{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.res a{display:block;padding:7px 10px;border-radius:6px;color:var(--ink);text-decoration:none;font-size:14px;line-height:1.4}
.res a:hover,.res a.act{background:var(--paper)}
.res a small{display:block;color:var(--muted);font-size:12px}
.res b.k{font-family:var(--f-display);font-size:15.5px}
mark{background:color-mix(in srgb,var(--accent) 26%,transparent);color:inherit;border-radius:2px;padding:0 1px}
.empty{color:var(--muted);padding:6px 4px}
.scrim{position:fixed;inset:0;background:rgba(8,10,16,.45);z-index:60}
.scrim[hidden],.drawer[hidden]{display:none}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,92vw);background:var(--sheet);border-left:1px solid var(--line);z-index:70;overflow:auto;padding:14px 18px 30px;box-shadow:-18px 0 40px rgba(10,14,25,.2)}
.drawer .dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.drawer .dh b{font-family:var(--f-display);font-size:18px}
.drawer ul{list-style:none;margin:0;padding:0}
.drawer li a{display:flex;justify-content:space-between;gap:8px;padding:7px 8px;border-radius:6px;color:var(--ink);text-decoration:none;border-left:3px solid transparent}
.drawer li a:hover{background:var(--paper)}
.drawer li a[aria-current]{font-weight:700;border-left-color:var(--accent);background:var(--paper)}
.drawer details{border-top:1px solid var(--line)}
.drawer summary{cursor:pointer;padding:9px 4px;font-weight:700;font-size:14px;list-style:none;display:flex;justify-content:space-between}
.drawer summary::-webkit-details-marker{display:none}
.drawer summary .c{margin-left:auto;margin-right:10px}
.drawer summary::after{content:"▾";color:var(--muted);font-size:11px}
.drawer details[open] summary::after{content:"▴"}
.drawer .c{font-family:var(--f-mono);font-size:11px;color:var(--muted);align-self:center}
@media (max-width:880px){
  .bar{flex-wrap:wrap;row-gap:0;padding-bottom:0}
  .brand{margin-right:auto;font-size:18px}
  .searchbox{display:none;order:5;width:100%;padding:6px 0 10px}
  .searchbox:focus-within{width:100%}
  .searchbox svg{left:11px;top:calc(50% - 2px)}
  .top.searching .searchbox{display:block}
  .top.searching .primary{display:none}
  #sbtn{display:inline-flex}
  .primary{order:4;width:100%;justify-content:space-between}
  .mi{flex:1;justify-content:center;padding:10px 6px}
  .spacer{display:none}
}
@keyframes flash{0%,60%{background:color-mix(in srgb,var(--accent) 22%,transparent)}100%{background:transparent}}
.flash{animation:flash 2.4s ease-out;border-radius:4px}
@media (prefers-reduced-motion:reduce){.flash{animation:none;background:color-mix(in srgb,var(--accent) 18%,transparent)}}

/* ramas en portada */
.branch{margin:34px 0 0}
.branch h2{margin:0 0 2px}
.cardsbar{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 18px}
.tile{flex:1 1 220px;background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:12px 14px;text-decoration:none;color:var(--ink)}
.tile:hover{border-color:var(--muted)}
.tile b{font-family:var(--f-display);font-size:17px;display:block}
.tile span{font-size:13px;color:var(--muted)}
.chip a{color:inherit;text-decoration:none}
/* cabeceras */
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(36px,6.5vw,64px);line-height:1.05;margin:6px 0 14px;letter-spacing:.03em;text-wrap:balance}
.intro{max-width:68ch}
.intro p{margin:0 0 10px}
.intro.clamped{max-height:9.5em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 60%,transparent)}
.more{font:inherit;font-size:13px;font-weight:700;background:none;border:0;color:var(--link);padding:0;cursor:pointer;margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 22px}
.chip{font-size:12.5px;border:1px solid var(--line);border-radius:99px;padding:3px 10px;color:var(--muted);background:var(--sheet)}

/* pestañas kata / bunkai */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tabs a{padding:8px 14px;text-decoration:none;color:var(--muted);font-weight:700;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs a[aria-current]{color:var(--ink);border-bottom-color:var(--accent)}

/* reproductor */
.player{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:28px;background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:22px}
.player.wide{grid-template-columns:minmax(0,460px) minmax(0,1fr)}
@media (max-width:700px){.player,.player.wide{grid-template-columns:minmax(0,1fr);padding:14px}}
.stage{background:var(--plate);border-radius:8px;aspect-ratio:5/6;max-width:100%;position:relative;overflow:hidden}
.player.wide .stage{aspect-ratio:4/3}
.stage img{position:absolute;inset:5%;width:90%;height:90%;object-fit:contain;transition:opacity .3s ease;mix-blend-mode:multiply}
.step img,.card img,.plates img,figure.chart img{mix-blend-mode:multiply}
.dir{position:absolute;top:10px;right:10px;font-size:12px;font-weight:700;background:var(--sheet);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:2px 8px}
.info{display:flex;flex-direction:column;gap:14px;min-width:0}
.num{font-family:var(--f-mono);font-size:40px;line-height:1;color:var(--muted)}
.num b{color:var(--ink);font-weight:500}
.cap{font-size:clamp(17px,2.2vw,21px);line-height:1.45;margin:0;min-height:3em}
.kiai{font-family:var(--f-mono);font-size:.7em;background:var(--accent);color:var(--sheet);padding:1px 6px;border-radius:3px;vertical-align:middle}
.ref{font:inherit;font-weight:700;color:var(--link);background:none;border:0;border-bottom:2px solid currentColor;padding:0;cursor:pointer}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:auto}
button.b{font:inherit;font-weight:700;font-size:14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:6px;padding:8px 14px;cursor:pointer}
button.b:hover{border-color:var(--muted)}
button.b.primary{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--link);outline-offset:2px}
input[type=range]{flex:1 1 160px;accent-color:var(--accent);min-width:0}

/* cuadrícula de pasos */
h2{font-family:var(--f-display);font-size:24px;margin:40px 0 6px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 16px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.step{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:8px 10px 10px;display:flex;flex-direction:column;gap:4px;text-align:left;font:inherit;color:var(--ink);cursor:pointer}
.step.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.step img{width:100%;aspect-ratio:5/6;object-fit:contain;background:var(--plate);border-radius:5px;padding:6px}
.grid.wide .step img{aspect-ratio:4/3}
.step .n{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.step p{margin:0;font-size:12.5px;line-height:1.4}

/* portada */
.lead{font-size:17px;max-width:62ch}
.stats{display:flex;flex-wrap:wrap;gap:28px;margin:22px 0 30px}
.stats div{font-size:13px;color:var(--muted)}
.stats b{display:block;font-family:var(--f-display);font-size:32px;color:var(--ink);line-height:1.1}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:10px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:6px}
.card:hover{border-color:var(--muted)}
.card img{width:100%;aspect-ratio:1;object-fit:contain;background:var(--plate);border-radius:5px;padding:6px}
.card b{font-family:var(--f-display);font-size:16px}
.card span{font-size:12px;color:var(--muted)}
.letter{font-family:var(--f-display);font-size:20px;margin:22px 0 8px;color:var(--accent)}

/* capítulos de texto */
.prose{max-width:70ch}
.prose h2{font-size:22px;margin:32px 0 8px}
.prose h3{font-size:17px;margin:22px 0 6px}
.prose p,.prose li{margin:0 0 10px}
.prose ul,.prose ol{padding-left:22px}
.prose table{border-collapse:collapse;font-size:14px;margin:10px 0 18px;width:100%}
.prose th,.prose td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
.tablewrap{overflow-x:auto}
.plates{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 22px}
.plates figure{margin:0;background:var(--plate);border-radius:6px;padding:6px;height:190px}
.plates.wide figure{height:170px}
.plates img{height:100%;width:auto;max-width:100%;display:block}
figure.chart{margin:8px 0 24px;background:var(--plate);border-radius:8px;padding:12px;overflow-x:auto}
figure.chart img{max-width:100%;height:auto;display:block;margin:0 auto}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:40px;border-top:1px solid var(--line);padding-top:14px;font-size:14px}
.note{margin-top:40px;font-size:12.5px;color:var(--muted);max-width:70ch;border-top:1px solid var(--line);padding-top:14px}
.loading{color:var(--muted);padding:40px 0}
</style>

<header class="top" id="top">
  <div class="bar">
    <a class="brand" href="#inicio">Katas en trazos</a>
    <nav class="primary" aria-label="Katas por rama">
      <button class="mi" data-menu="shorin" aria-expanded="false" aria-controls="dd">Shorin <span class="car">▾</span></button>
      <button class="mi" data-menu="tomari" aria-expanded="false" aria-controls="dd">Tomari-te <span class="car">▾</span></button>
      <button class="mi" data-menu="naha" aria-expanded="false" aria-controls="dd">Naha-te <span class="car">▾</span></button>
    </nav>
    <span class="spacer"></span>
    <div class="searchbox" role="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Buscar kata, técnica, término…" aria-label="Buscar" autocomplete="off" spellcheck="false">
    </div>
    <button class="icon" id="sbtn" aria-label="Buscar" aria-expanded="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
    <button class="icon" id="burger" aria-label="Menú" aria-expanded="false" aria-controls="drawer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </div>
  <div class="panel" id="dd" hidden></div>
  <div class="panel res" id="results" hidden aria-live="polite"></div>
</header>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="Menú"></aside>
<div class="wrap">
  <main id="main"><p class="loading">Cargando…</p></main>
</div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
let IDX=null, cache={}, cur=0, timer=null, front='imgA', S=[], KATA=null, MODE='kata';
const TOMO={'2':'Tomo II','3':'Tomo III','4':'Tomo IV'};

async function getJSON(name){
  if(cache[name])return cache[name];
  const r=await fetch('data/'+name+'.json'); if(!r.ok)throw new Error('No se pudo cargar '+name);
  return cache[name]=await r.json();
}

/* ---------- datos de navegación ---------- */
const BR={
  shorin:{name:'Shorin',d:'Katas de la rama de Shuri (Shuri-te, hoy Shorin): los Pinan y Naihanchi de Itosu, Kushanku, Patsai y sus variantes.'},
  tomari:{name:'Tomari-te',d:'Katas de la rama del puerto de Tomari: Wanshu, Wankan, Lohai, Sochin, Empi y otros.'},
  naha:{name:'Naha-te',d:'Katas de la rama de Naha, de donde sale el Goju ryu: Sanchin, Tensho, Saifa, Seipa, Sanseiru y compañía.'}
};
const KIHON=()=>IDX.chapters.filter(c=>c.group==='tec');
const REF=()=>IDX.chapters.filter(c=>['lexico','grados','escuelas'].includes(c.id));
const TEO=()=>IDX.chapters.filter(c=>c.group==='gen'&&!['lexico','grados'].includes(c.id));
const inBranch=b=>IDX.katas.filter(k=>k.branch===b).sort((x,y)=>x.name.localeCompare(y.name,'es'));
const norm=s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const cur_=()=>location.hash.slice(1).split('/')[0];
const hereKata=()=>{const h=cur_();return h.startsWith('k-')||h.startsWith('b-')?h.slice(2):null};
const hereCh=()=>{const h=cur_();return h.startsWith('t-')?h.slice(2):null};

/* ---------- menús desplegables y cajón ---------- */
let openMenu=null;
function closeAll(){
  openMenu=null; $('dd').hidden=true; $('results').hidden=true;
  document.querySelectorAll('.mi').forEach(b=>b.setAttribute('aria-expanded','false'));
  closeDrawer();
}
function markNav(){
  const hk=hereKata(), k=hk&&IDX.katas.find(x=>x.slug===hk);
  document.querySelectorAll('.mi').forEach(b=>b.classList.toggle('here',!!k&&k.branch===b.dataset.menu));
}
function showMenu(id){
  if(openMenu===id){closeAll();return}
  closeAll(); openMenu=id;
  const hk=hereKata(), b=BR[id];
  const items=inBranch(id);
  $('dd').innerHTML=`<div class="pin"><h3>${b.name}</h3><p class="d">${b.d} <span style="white-space:nowrap">${items.length} katas</span></p>
   <ul class="links">${items.map(k=>`<li><a href="#k-${k.slug}"${hk===k.slug?' aria-current="page"':''}>${esc(k.name)}<span class="c">${k.n}</span></a></li>`).join('')}</ul></div>`;
  $('dd').hidden=false;
  document.querySelector(`.mi[data-menu="${id}"]`).setAttribute('aria-expanded','true');
}
document.querySelectorAll('.mi').forEach(b=>b.onclick=e=>{e.stopPropagation();showMenu(b.dataset.menu)});
function drawerHTML(){
  const hk=hereKata(), hc=hereCh();
  const ch=l=>`<ul>${l.map(c=>`<li><a href="#t-${c.id}"${hc===c.id?' aria-current="page"':''}>${esc(c.title)}</a></li>`).join('')}</ul>`;
  const kt=b=>`<ul>${inBranch(b).map(k=>`<li><a href="#k-${k.slug}"${hk===k.slug?' aria-current="page"':''}>${esc(k.name)}<span class="c">${k.n}</span></a></li>`).join('')}</ul>`;
  const od=(open,t,body)=>`<details${open?' open':''}><summary>${t}</summary>${body}</details>`;
  const hkk=hk&&IDX.katas.find(x=>x.slug===hk);
  return `<div class="dh"><b>Menú</b><button class="icon" id="dclose" aria-label="Cerrar menú"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
   <ul><li><a href="#inicio"${cur_()==='inicio'||!cur_()?' aria-current="page"':''}>Inicio</a></li></ul>
   ${od(!!hc&&KIHON().some(c=>c.id===hc),'Kihon · técnica básica',ch(KIHON()))}
   ${od(!!hc&&REF().some(c=>c.id===hc),'Vocabulario y referencia',ch(REF()))}
   ${od(!!hc&&TEO().some(c=>c.id===hc),'Teoría y espíritu del karate',ch(TEO()))}
   <h4>Todos los katas</h4>
   ${['shorin','tomari','naha'].map(b=>od(hkk&&hkk.branch===b,`${BR[b].name} <span class="c">${inBranch(b).length}</span>`,kt(b))).join('')}`;
}
function openDrawer(){
  closeAll(); $('drawer').innerHTML=drawerHTML(); $('drawer').hidden=false; $('scrim').hidden=false;
  $('burger').setAttribute('aria-expanded','true'); $('dclose').onclick=closeDrawer; $('dclose').focus();
}
function closeDrawer(){ if($('drawer').hidden)return; $('drawer').hidden=true; $('scrim').hidden=true; $('burger').setAttribute('aria-expanded','false') }
$('burger').onclick=e=>{e.stopPropagation(); $('drawer').hidden?openDrawer():closeDrawer()};
$('scrim').onclick=closeDrawer;
$('drawer').addEventListener('click',e=>{if(e.target.closest('a'))closeDrawer()});
$('dd').addEventListener('click',e=>{if(e.target.closest('a'))closeAll()});
document.addEventListener('click',e=>{if(!e.target.closest('.top')&&!e.target.closest('.drawer'))closeAll()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const was=!$('results').hidden||openMenu||!$('drawer').hidden;closeAll();if(was)$('q').blur()}});
$('sbtn').onclick=e=>{e.stopPropagation();const t=$('top');t.classList.toggle('searching');const on=t.classList.contains('searching');$('sbtn').setAttribute('aria-expanded',String(on));if(on)$('q').focus();else{$('results').hidden=true}};

/* ---------- buscador ---------- */
let SEARCH=null, sloading=null;
function loadSearch(){ if(SEARCH||sloading)return sloading; return sloading=getJSON('search').then(d=>{SEARCH=d;SEARCH.nk=d.k.map(r=>norm(r[3]));SEARCH.nc=d.c.map(r=>norm(r[1]));if($('q').value.trim())runSearch()}).catch(()=>{}) }
function hl(orig,toks){
  let nm='',map=[];
  for(let i=0;i<orig.length;i++){const n=orig[i].normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();for(const c of n){nm+=c;map.push(i)}}
  const mark=new Array(orig.length).fill(false);
  for(const t of toks){let p=0;while((p=nm.indexOf(t,p))>=0){for(let j=p;j<p+t.length;j++)mark[map[j]]=true;p+=t.length}}
  let out='',on=false;
  for(let i=0;i<orig.length;i++){if(mark[i]&&!on){out+='<mark>';on=true}if(!mark[i]&&on){out+='</mark>';on=false}out+=esc(orig[i])}
  return out+(on?'</mark>':'');
}
function snippet(t,toks,w=150){
  const n=norm(t); let p=toks.map(x=>n.indexOf(x)).filter(i=>i>=0); p=p.length?Math.min(...p):0;
  if(t.length<=w)return t;
  const a=Math.max(0,p-40); return (a>0?'…':'')+t.slice(a,a+w)+(a+w<t.length?'…':'');
}
function runSearch(){
  const raw=$('q').value.trim();
  if(raw.length<2){$('results').hidden=true;return}
  const toks=norm(raw).split(/\s+/).filter(Boolean);
  const all=s=>toks.every(t=>s.includes(t));
  closeDrawer(); if(openMenu){openMenu=null;$('dd').hidden=true;document.querySelectorAll('.mi').forEach(b=>b.setAttribute('aria-expanded','false'))}
  let h='';
  const ks=IDX.katas.filter(k=>all(norm(k.name))).slice(0,10);
  if(ks.length)h+=`<div class="res-sec"><h4>Katas</h4>${ks.map(k=>`<a href="#k-${k.slug}"><b class="k">${hl(k.name,toks)}</b><small>${BR[k.branch].name} · ${k.n} movimientos${k.nb?' · con bunkai':''}</small></a>`).join('')}</div>`;
  const cs=IDX.chapters.filter(c=>all(norm(c.title))).slice(0,8);
  if(cs.length)h+=`<div class="res-sec"><h4>Capítulos</h4>${cs.map(c=>`<a href="#t-${c.id}">${hl(c.title,toks)}</a>`).join('')}</div>`;
  if(!SEARCH){h+=`<p class="empty">Cargando el índice de movimientos y vocabulario…</p>`;loadSearch()}
  else{
    const ct=[],seen={};
    for(let i=0;i<SEARCH.c.length&&ct.length<10;i++){if(all(SEARCH.nc[i])){const id=SEARCH.c[i][0];seen[id]=(seen[id]||0)+1;if(seen[id]<=2)ct.push(SEARCH.c[i])}}
    const title=id=>(IDX.chapters.find(c=>c.id===id)||{}).title||id;
    if(ct.length)h+=`<div class="res-sec"><h4>En los textos y el vocabulario</h4>${ct.map(r=>`<a href="#t-${r[0]}" data-q="${esc(raw)}">${hl(snippet(r[1],toks),toks)}<small>${esc(title(r[0]))}</small></a>`).join('')}</div>`;
    const mv=[]; let total=0;
    for(let i=0;i<SEARCH.k.length;i++){if(all(SEARCH.nk[i])){total++;if(mv.length<18)mv.push(SEARCH.k[i])}}
    const kn=slug=>(IDX.katas.find(k=>k.slug===slug)||{}).name||slug;
    if(mv.length)h+=`<div class="res-sec"><h4>Movimientos${total>mv.length?` (${mv.length} de ${total})`:''}</h4>${mv.map(r=>`<a href="#${r[1]==='b'?'b':'k'}-${r[0]}/${encodeURIComponent(r[2])}">${hl(r[3],toks)}<small>${esc(kn(r[0]))} · ${r[1]==='b'?'bunkai, paso':'movimiento'} ${esc(r[2])}</small></a>`).join('')}</div>`;
  }
  if(!h)h=`<p class="empty">Nada coincide con «${esc(raw)}». Prueba con otra palabra (por ejemplo <em>mae geri</em>, <em>zenkutsu</em>, <em>Pinan</em>).</p>`;
  $('results').innerHTML=`<div class="pin" style="max-width:820px">${h}</div>`;
  $('results').hidden=false; actI=-1;
}
let actI=-1, qt=null;
$('q').addEventListener('input',()=>{clearTimeout(qt);qt=setTimeout(runSearch,90)});
$('q').addEventListener('focus',()=>{loadSearch();if($('q').value.trim().length>=2)runSearch()});
$('q').addEventListener('keydown',e=>{
  const L=[...$('results').querySelectorAll('a')];
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){if(!L.length)return;e.preventDefault();actI=(actI+(e.key==='ArrowDown'?1:-1)+L.length)%L.length;L.forEach((a,i)=>a.classList.toggle('act',i===actI));L[actI].scrollIntoView({block:'nearest'})}
  if(e.key==='Enter'){const a=L[actI>=0?actI:0];if(a)a.click()}
});
$('results').addEventListener('click',e=>{const a=e.target.closest('a');if(a){PENDQ=a.dataset.q||null;closeAll();$('q').blur();$('top').classList.remove('searching')}});
let PENDQ=null;

/* ---------- portada ---------- */
function branchCards(b){
  return inBranch(b).map(k=>`<a class="card" href="#k-${k.slug}">${k.thumb?`<img loading="lazy" src="${k.thumb}" alt="">`:''}<b>${esc(k.name)}</b><span>${TOMO[k.tome]} · ${k.n} mov.${k.nb?` · bunkai`:''}</span></a>`).join('');
}
function home(){
  const K=IDX.katas, nsteps=K.reduce((a,k)=>a+k.n,0), nb=K.reduce((a,k)=>a+k.nb,0);
  let html=`<div class="eyebrow">Butoku-kai · Shorinji ryu</div><h1>Katas en trazos</h1>
  <p class="lead">El manual de karate de los Tomos II, III y IV, traducido del francés y con las fotografías convertidas en siluetas dibujadas. Cada kata se puede seguir movimiento a movimiento o reproducir de principio a fin, y casi todos incluyen su <em>bunkai</em>.</p>
  <div class="stats"><div><b>${K.length}</b>katas</div><div><b>${nsteps.toLocaleString('es')}</b>movimientos</div><div><b>${nb.toLocaleString('es')}</b>fotos de bunkai</div><div><b>${IDX.chapters.length}</b>capítulos de teoría y técnica</div></div>
  <div class="cardsbar">
    <a class="tile" href="#t-posturas"><b>Kihon</b><span>Saludo, posturas, paradas, ataques y kumite básico</span></a>
    <a class="tile" href="#t-lexico"><b>Vocabulario</b><span>Léxico japonés–castellano</span></a>
    <a class="tile" href="#t-grados"><b>Grados</b><span>Progresión del 5.º kyu al 10.º dan</span></a>
    <a class="tile" href="#t-que-es"><b>Teoría</b><span>Qué es el karate, dojo-kun, normas</span></a>
  </div>`;
  for(const b of ['shorin','tomari','naha'])html+=`<section class="branch"><h2>${BR[b].name}</h2><p class="sub">${BR[b].d}</p><div class="cards">${branchCards(b)}</div></section>`;
  html+=`<p class="note">La agrupación de los katas por rama (Shorin, Tomari-te, Naha-te) es orientativa y sigue las tradiciones que cuenta el propio libro; varios katas se practican en más de una rama. Material de estudio privado basado en los manuales de Jean Chalamon (Butoku-kai Europe). Los dibujos se generan a partir de las fotografías originales, sin fondo y con las caras borradas; siguen siendo una obra derivada del libro.</p>`;
  $('main').innerHTML=html;
}

/* ---------- kata y bunkai ---------- */
function capHTML(t,link){
  t=esc(t).replace(/KIAI!?/,'<span class="kiai">KIAI</span>');
  return link?t.replace(/([Rr]epetir (?:el|la secuencia del) |[Ii]gual que el |como en el )(\d+)/g,(m,p,n)=>`${p}<button class="ref" data-to="${n}" aria-label="Ir al movimiento ${n}">${n}</button>`):t;
}
async function kataView(slug,mode,label){
  stop();
  const k=await getJSON('k-'+slug); KATA=k; MODE=mode; S=mode==='bunkai'?k.bunkai:k.steps; if(!S.length&&mode==='bunkai'){S=k.steps;MODE='kata'}
  const wide=MODE==='bunkai';
  const nb=k.bunkai.length;
  const meta=IDX.katas.find(x=>x.slug===slug)||{};
  const brn=BR[meta.branch]||{name:''};
  const chips=[`<a href="#inicio" onclick="event.preventDefault();showMenu('${meta.branch}')">${brn.name}</a>`,`${k.steps.filter(s=>s.l!=='Fin').length} movimientos`,nb?`${nb} fotos de bunkai`:'sin bunkai'];
  $('main').innerHTML=`<div class="eyebrow">${esc(k.eyebrow)}</div><h1>${esc(k.name)}</h1>
   ${k.intro?`<div class="intro" id="intro">${k.intro}</div><button class="more" id="more" hidden>Leer más</button>`:''}
   <div class="chips">${chips.map(c=>`<span class="chip">${c}</span>`).join('')}</div>
   <div class="tabs" role="tablist"><a href="#k-${slug}" ${MODE==='kata'?'aria-current="page"':''}>Kata</a>${nb?`<a href="#b-${slug}" ${MODE==='bunkai'?'aria-current="page"':''}>Bunkai</a>`:''}</div>
   <section class="player${wide?' wide':''}" aria-label="Reproductor">
     <div class="stage" id="stage"><img id="imgA" alt=""><img id="imgB" alt="" style="opacity:0"><span class="dir" id="dir" hidden></span></div>
     <div class="info"><div class="num" id="num"></div><p class="cap" id="cap" aria-live="polite"></p>
       <div class="controls"><button class="b" id="prev" aria-label="Anterior">◀</button><button class="b primary" id="play">Reproducir</button><button class="b" id="next" aria-label="Siguiente">▶</button><input id="slider" type="range" min="0" max="${S.length-1}" value="0" aria-label="Elegir movimiento"></div>
     </div>
   </section>
   <h2>${MODE==='bunkai'?'Todas las fotos del bunkai':'Todos los movimientos'}</h2>
   <p class="sub">Pulsa un ${MODE==='bunkai'?'paso':'movimiento'} para verlo arriba. También puedes usar las flechas ← → del teclado.</p>
   <div class="grid${wide?' wide':''}" id="grid">${S.map((s,i)=>`<button class="step" data-i="${i}"><span class="n">${esc(s.l)}</span>${s.img?`<img loading="lazy" src="${s.img}" alt="">`:''}<p>${capHTML(s.t)}</p></button>`).join('')}</div>`;
  const intro=$('intro');
  if(intro&&intro.scrollHeight>220){intro.classList.add('clamped');$('more').hidden=false;$('more').onclick=()=>{intro.classList.remove('clamped');$('more').hidden=true}}
  front='imgA'; go(0);
  const sib=inBranch(meta.branch), si=sib.findIndex(x=>x.slug===slug);
  if(sib.length>1){
    const pv=sib[si-1], nx=sib[si+1];
    $('main').insertAdjacentHTML('beforeend',`<div class="pager"><span>${pv?`← <a href="#k-${pv.slug}">${esc(pv.name)}</a>`:''}</span><span style="color:var(--muted)">${brn.name}</span><span>${nx?`<a href="#k-${nx.slug}">${esc(nx.name)}</a> →`:''}</span></div>`);
  }
  if(label!=null){const j=S.findIndex(s=>s.l===label);if(j>=0){go(j);setTimeout(()=>$('stage').scrollIntoView({behavior:'smooth',block:'center'}),60)}}
  $('grid').onclick=e=>{const b=e.target.closest('.step');if(b){stop();go(+b.dataset.i);$('stage').scrollIntoView({behavior:'smooth',block:'center'})}};
  $('cap').onclick=e=>{const b=e.target.closest('.ref');if(b){stop();const j=S.findIndex(s=>s.l===b.dataset.to);if(j>=0)go(j)}};
  $('play').onclick=()=>{if(timer){stop();return} if(cur>=S.length-1)go(0); $('play').textContent='Pausa';
    timer=setInterval(()=>{if(cur>=S.length-1){stop();return}go(cur+1)},MODE==='bunkai'?2600:1600)};
  $('prev').onclick=()=>{stop();go(cur-1)}; $('next').onclick=()=>{stop();go(cur+1)};
  $('slider').oninput=e=>{stop();go(+e.target.value)};
}
function go(i){
  if(!S.length)return;
  i=Math.max(0,Math.min(S.length-1,i)); cur=i; const s=S[i];
  $('num').innerHTML=`<b>${esc(s.l)}</b> / ${S.length}`;
  $('cap').innerHTML=capHTML(s.t,MODE==='kata');
  const d=$('dir'); d.hidden=!s.d; if(s.d)d.textContent='Mira al '+s.d;
  $('slider').value=i;
  document.querySelectorAll('.step').forEach(b=>b.classList.toggle('on',+b.dataset.i===i));
  const back=front==='imgA'?'imgB':'imgA';
  if(s.img){$(back).src=s.img}else{$(back).removeAttribute('src')}
  $(back).alt=(MODE==='bunkai'?'Bunkai, paso ':'Movimiento ')+s.l+': '+s.t;
  $(back).style.opacity=1; $(front).style.opacity=0; front=back;
}
function stop(){clearInterval(timer);timer=null;const p=$('play');if(p)p.textContent='Reproducir'}
document.addEventListener('keydown',e=>{if(!$('slider')||e.target.tagName==='INPUT')return;
  if(e.key==='ArrowRight'){stop();go(cur+1)} if(e.key==='ArrowLeft'){stop();go(cur-1)}});

/* ---------- capítulos ---------- */
async function chapterView(id){
  stop();
  const c=await getJSON('t-'+id);
  const list=IDX.chapters, i=list.findIndex(x=>x.id===id);
  const grp={gen:'Tomo II · Generalidades',tec:'Tomo II · Técnica y kumite',anx:'Anexos · Tomo III'}[c.group];
  const prev=list[i-1], next=list[i+1];
  $('main').innerHTML=`<div class="eyebrow">${grp}</div><h1>${esc(c.title)}</h1><article class="prose">${c.html.replace(/<table>/g,'<div class="tablewrap"><table>').replace(/<\/table>/g,'</table></div>')}</article>
   <div class="pager"><span>${prev?`← <a href="#t-${prev.id}">${esc(prev.title)}</a>`:''}</span><span>${next?`<a href="#t-${next.id}">${esc(next.title)}</a> →`:''}</span></div>`;
  if(PENDQ){
    const toks=norm(PENDQ).split(/\s+/).filter(Boolean); PENDQ=null;
    const el=[...document.querySelectorAll('.prose p,.prose li,.prose tr,.prose h2,.prose h3')].find(e=>{const n=norm(e.textContent);return toks.every(t=>n.includes(t))});
    if(el){setTimeout(()=>{el.scrollIntoView({block:'center'});el.classList.add('flash')},80)}
  }
}

/* ---------- enrutado ---------- */
async function route(){
  const raw=location.hash.slice(1)||'inicio';
  const [h,lab0]=raw.split('/'); const lab=lab0!=null?decodeURIComponent(lab0):null;
  closeAll(); markNav();
  try{
    if(h.startsWith('k-'))await kataView(h.slice(2),'kata',lab);
    else if(h.startsWith('b-'))await kataView(h.slice(2),'bunkai',lab);
    else if(h.startsWith('t-'))await chapterView(h.slice(2));
    else home();
    document.title=(document.querySelector('h1')?.textContent||'')+(h==='inicio'?'':' · Katas en trazos');
  }catch(err){$('main').innerHTML=`<p class="loading">No se ha podido cargar esta sección. Vuelve a intentarlo recargando la página.</p>`}
  if(lab==null)window.scrollTo({top:0});
}
addEventListener('hashchange',route);
(async()=>{
  try{IDX=await getJSON('index')}catch(e){$('main').innerHTML='<p class="loading">No se ha podido cargar el índice.</p>';return}
  route();
})();
</script>
